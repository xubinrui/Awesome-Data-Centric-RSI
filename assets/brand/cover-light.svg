<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
<title id="title">Better data. Better loops.</title>
<desc id="desc">Data-Centric RSI research atlas. Generate, curate, verify and learn in a repeating feedback loop.</desc>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#d8e7e3" stroke-width=".7"/></pattern>
  <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#087f70"/></marker>
</defs>
<rect width="1100" height="300" rx="16" fill="#edf5f3"/>
<rect x="635" y="1" width="464" height="298" rx="16" fill="url(#grid)"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="40" y="36" width="5" height="13" rx="2" fill="#087f70"/>
<text x="57" y="47" font-size="12" font-weight="700" letter-spacing="2" fill="#496770">DATA-CENTRIC RSI / RESEARCH ATLAS</text>
<text x="40" y="117" font-size="53" font-weight="700" letter-spacing="-2" fill="#102c39">Better data.</text>
<text x="40" y="176" font-size="53" font-weight="700" letter-spacing="-2" fill="#087f70">Better loops.</text>
<text x="43" y="219" font-size="16" fill="#496770">Mapping how learning systems improve</text>
<text x="43" y="242" font-size="16" fill="#496770">the data they learn from.</text>
<path d="M810 93 H861 M937 119 V176 M862 203 H813 M737 177 V121" fill="none" stroke="#087f70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="667" y="66" width="140" height="54" rx="9" fill="#ffffff" stroke="#bdcec8"/><text x="681" y="98" font-size="11" font-weight="700" fill="#087f70">01</text><text x="707" y="99" font-size="16" font-weight="700" fill="#102c39">Generate</text>
<rect x="867" y="66" width="140" height="54" rx="9" fill="#ffffff" stroke="#bdcec8"/><text x="881" y="98" font-size="11" font-weight="700" fill="#087f70">02</text><text x="907" y="99" font-size="16" font-weight="700" fill="#102c39">Curate</text>
<rect x="867" y="178" width="140" height="54" rx="9" fill="#ffffff" stroke="#bdcec8"/><text x="881" y="210" font-size="11" font-weight="700" fill="#087f70">03</text><text x="907" y="211" font-size="16" font-weight="700" fill="#102c39">Verify</text>
<rect x="667" y="178" width="140" height="54" rx="9" fill="#ffffff" stroke="#bdcec8"/><text x="681" y="210" font-size="11" font-weight="700" fill="#087f70">04</text><text x="707" y="211" font-size="16" font-weight="700" fill="#102c39">Learn</text>
<text x="837" y="152" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="2" fill="#496770">REFINE. REPEAT.</text>
</g>
</svg>
