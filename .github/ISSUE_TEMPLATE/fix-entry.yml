name: Fix an entry
description: Wrong label, wrong metadata, dead link, or a summary that misreads the paper
title: "[fix] <entry id>"
labels: [fix]
body:
  - type: input
    id: entry
    attributes:
      label: Entry id
      description: The filename without .yaml, e.g. self-instruct-2022
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong
      options:
        - Wrong dimension label
        - Wrong metadata (title, year, authors, venue)
        - Dead or wrong link
        - Summary misreads the paper
        - Duplicate entry
        - Should not be in scope
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: The correction
      description: What it says now, what it should say, and the evidence.
    validations:
      required: true
